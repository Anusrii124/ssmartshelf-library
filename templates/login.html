{% extends "base.html" %}
{% block title %}Log in | SmartShelf{% endblock %}
{% block content %}
<div class="auth-wrap"><section class="auth-card">
  <p class="eyebrow">WELCOME BACK</p><h1>Log in to SmartShelf</h1><p class="muted">Access your library dashboard and borrowing history.</p>
  <form method="post" class="form-stack">
    <label>Email address<input type="email" name="email" required autocomplete="username" placeholder="you@example.com"></label>
    <label>Password<input type="password" name="password" required autocomplete="current-password" placeholder="Enter your password"></label>
    <button class="button primary-button full" type="submit">Log in</button>
  </form>
  <p class="auth-bottom">New student? <a href="{{ url_for('register') }}">Create an account</a></p>
  
</section></div>
{% endblock %}
